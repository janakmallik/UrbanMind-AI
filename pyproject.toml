[project]
name = "urbanmind-ai"
version = "0.1.0"
description = "A multimodal ML/DL system for urban scene understanding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Janak Mallik" }]

dependencies = [
    # Core data
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    # Classical ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    # Deep learning — pinned to CUDA 12.4 builds
    "torch==2.6.0",
    "torchvision==0.21.0",
    "pytorch-lightning>=2.4",
    # Transformers / NLP / Vision
    "transformers>=4.45",
    "datasets>=3.0",
    "sentence-transformers>=3.0",
    "timm>=1.0",
    # Experiment / config
    "mlflow>=2.16",
    "hydra-core>=1.3",
    "optuna>=4.0",
    # Validation
    "pydantic>=2.9",
    "pandera>=0.20",
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.39",
    # Utilities
    "rich>=13.9",
    "tqdm>=4.66",
    "python-dotenv>=1.2.4",
    "h5py>=3.16.0",
    "tables>=3.11.1",
    "kagglehub",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanintel"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
kagglehub = { git = "https://github.com/Kaggle/kagglehub.git" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
